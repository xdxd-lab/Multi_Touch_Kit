<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MultiTouchKit 網頁範例</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="brand.css">
<style>
  /* 深色與 mtk-viewer 相同（黑底上的彩色觸點）；淺色時改為淺灰底，觸點顏色不變。--canvas／--grid 也供畫布讀取 */
  :root {
    color-scheme: dark light;
    --canvas: #0E0F13; --text: #E6E8EC; --muted: #9198A1; --grid: rgba(255, 255, 255, 0.55);
    --panel: rgba(28, 30, 37, 0.72); --panel-border: rgba(255, 255, 255, 0.08); --button: rgba(255, 255, 255, 0.08);
    --online: #3FB950; --offline: #D29922;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --canvas: #F3F4F6; --text: #1F2328; --muted: #59636E; --grid: rgba(0, 0, 0, 0.45);
      --panel: rgba(255, 255, 255, 0.78); --panel-border: rgba(0, 0, 0, 0.08); --button: rgba(0, 0, 0, 0.05);
      --online: #1A7F37; --offline: #9A6700;
    }
  }
  html, body { margin: 0; height: 100%; background: var(--canvas); color: var(--text); overflow: hidden;
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", sans-serif; }
  /* 用 fixed＋inset 而不是 100vw／100vh：Safari 的 vh 可能不等於實際內容區高度，捲軸設為「永遠顯示」時 100vw 也會比內容區寬 */
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  #panel { position: fixed; left: 16px; top: 16px; max-width: min(560px, calc(100vw - 32px)); pointer-events: none;
    padding: 12px 16px 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--panel-border);
    -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18); }
  #brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 15px; letter-spacing: -0.01em; margin-bottom: 6px; }
  #brand img { width: 26px; height: 26px; }
  /* 字標：MultiTouch 10 個字母 = 10 根手指（鏡像配色，色彩來自 brand.css），Kit 為暖色魔法漸層 */
  .mark .thumb { color: var(--mtk-thumb); } .mark .index { color: var(--mtk-index); } .mark .middle { color: var(--mtk-middle); }
  .mark .ring { color: var(--mtk-ring); } .mark .little { color: var(--mtk-little); }
  .mark .kit { background: var(--mtk-kit); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #status { width: 8px; height: 8px; border-radius: 50%; background: var(--offline); box-shadow: 0 0 0 3px color-mix(in srgb, var(--offline) 25%, transparent); }
  #panel[data-connected="true"] #status { background: var(--online); box-shadow: 0 0 0 3px color-mix(in srgb, var(--online) 25%, transparent); }
  /* D 模式：面板移到第一、二列校正十字（10%、50%）之間的正中央，不遮住左上的十字 */
  #panel[data-debug="true"] { left: 50%; top: 30%; transform: translate(-50%, -50%); }
  #hud { white-space: pre-wrap; color: var(--muted); font-variant-numeric: tabular-nums; }
  #fullscreen { position: fixed; right: 16px; top: 16px; font: inherit; font-weight: 550; color: var(--text); cursor: pointer;
    padding: 7px 14px; border-radius: 999px; background: var(--button); border: 1px solid var(--panel-border);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
  #fullscreen:hover { background: color-mix(in srgb, var(--button) 60%, var(--text) 10%); }
  :fullscreen #fullscreen, :-webkit-full-screen #fullscreen { display: none; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="panel" data-connected="false">
  <div id="brand"><img src="favicon.svg" alt=""><span class="mark"><span class="little">M</span><span class="ring">u</span><span class="middle">l</span><span class="index">t</span><span class="thumb">i</span><span class="thumb">T</span><span class="index">o</span><span class="middle">u</span><span class="ring">c</span><span class="little">h</span><span class="kit">Kit</span></span><span id="status"></span></div>
  <div id="hud">連線中…</div>
</div>
<button id="fullscreen">全螢幕（F）</button>
<script>
// 連線 mtk-server 的 WebSocket，畫出每根手指。網址可用 ?ws=ws://主機:埠 覆寫。
//
// 座標換算：觸點的 x、y 是「整片觸控面板」的 0..1（原點左上）。網頁的內容區通常不等於整片面板：
// 視窗模式時只佔一部分；Safari 全螢幕（綠色按鈕）時頂部的工具列／分頁列仍會佔用。
// 直接乘上畫布尺寸就會出現系統性偏差（越遠離內容區與面板重疊的邊，偏得越多）。所以：
//   1. 以 Fullscreen API 全螢幕時（按 F 或右上角按鈕），內容區就是整個螢幕：x × 寬、y × 高。
//   2. 否則用 mtk-server hello 中觸控螢幕的位置（display.bounds，全域座標，單位為點＝CSS px）
//      與視窗在螢幕上的位置，換算出觸點在內容區中的位置（與 Unity 的 KeyWindow 模式相同）。
//   3. 沒有顯示器資訊（舊版 mtk-server）時退回 1. 的算法。
// 按 D 顯示診斷資訊與校正十字（觸碰十字中心，圓點應落在十字上）。頁面縮放請維持 100%。
const params = new URLSearchParams(location.search);
const url = params.get("ws") || "ws://127.0.0.1:7778";
const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");
const panel = document.getElementById("panel");
// 畫布顏色跟隨深淺色（CSS 變數）；切換外觀時重新讀取
const theme = { canvas: "#0E0F13", grid: "rgba(255,255,255,0.55)" };
function readTheme() {
  const style = getComputedStyle(document.documentElement);
  theme.canvas = style.getPropertyValue("--canvas").trim() || theme.canvas;
  theme.grid = style.getPropertyValue("--grid").trim() || theme.grid;
}
if (typeof matchMedia === "function") {
  readTheme();
  matchMedia("(prefers-color-scheme: light)").addEventListener("change", readTheme);
}
const touches = new Map();   // id → {x, y}（面板正規化座標）
const ripples = [];          // 按下時的擴散圈
let maxTouches = 0, taps = 0, frames = 0, devices = [], display = null, connected = false;
let debug = params.has("debug");

// MARK: - 座標換算（純函式，Tests/WebExample 以 jsc 測試）

/**
 * 面板正規化座標 → 內容區（viewport）的 CSS px。
 * @param {{x:number, y:number}} touch 0..1，原點在觸控面板左上
 * @param {{fullscreen:boolean, screenX:number, screenY:number, outerWidth:number, outerHeight:number,
 *          innerWidth:number, innerHeight:number}} win 視窗幾何（window 上的同名屬性）
 * @param {number[]|null} bounds 觸控螢幕的 [x, y, 寬, 高]（全域座標，點）；null 時視為內容區即面板
 * @returns {{x:number, y:number, mode:string}}
 */
function mapTouch(touch, win, bounds) {
  if (win.fullscreen || !bounds) {
    return { x: touch.x * win.innerWidth, y: touch.y * win.innerHeight, mode: win.fullscreen ? "fullscreen" : "viewport" };
  }
  const v = viewportOnScreen(win);
  const [bx, by, bw, bh] = bounds;
  return { x: bx + touch.x * bw - v.left, y: by + touch.y * bh - v.top, mode: "window" };
}

/**
 * 內容區左上角的全域座標。macOS 的視窗沒有左右與下方邊框，外框與內容區的高度差都是上方的標題列／工具列。
 * 開發者工具停靠在側邊或下方、或頁面縮放不是 100% 時這個假設不成立（見 geometryWarning）。
 */
function viewportOnScreen(win) {
  return { left: win.screenX + (win.outerWidth - win.innerWidth) / 2, top: win.screenY + (win.outerHeight - win.innerHeight) };
}

/** 換算可能不準的情況；沒有問題時回傳空字串 */
function geometryWarning(win, bounds, screenSize) {
  if (!bounds) return "mtk-server 沒有提供觸控螢幕位置（舊版？），假設內容區就是整片面板";
  if (win.fullscreen && (Math.abs(screenSize.width - bounds[2]) > 1 || Math.abs(screenSize.height - bounds[3]) > 1)) {
    return `全螢幕所在的螢幕（${screenSize.width}x${screenSize.height}）與觸控螢幕（${bounds[2]}x${bounds[3]}）大小不同：請把視窗移到觸控螢幕再全螢幕`;
  }
  if (!win.fullscreen && Math.abs(win.outerWidth - win.innerWidth) > 2) {
    return "視窗寬度與內容區寬度不同（頁面縮放不是 100%，或開發者工具停靠在側邊），位置可能有偏差";
  }
  return "";
}

// MARK: - 瀏覽器

function windowGeometry() {
  return {
    fullscreen: !!(document.fullscreenElement || document.webkitFullscreenElement),
    screenX, screenY, outerWidth, outerHeight, innerWidth, innerHeight,
  };
}

function toggleFullscreen() {
  const root = document.documentElement;
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } else {
    (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
  }
}
document.getElementById("fullscreen").addEventListener("click", toggleFullscreen);
addEventListener("keydown", (e) => {
  if (e.key === "f" || e.key === "F") toggleFullscreen();
  if (e.key === "d" || e.key === "D") debug = !debug;
});

// 畫布的實際像素每幀對齊內容區：全螢幕切換、移到不同 devicePixelRatio 的螢幕時不一定會觸發 resize
function syncCanvasSize() {
  const s = devicePixelRatio, w = Math.round(canvas.clientWidth * s), h = Math.round(canvas.clientHeight * s);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  ctx.setTransform(s, 0, 0, s, 0, 0); // 之後都以 CSS px 繪製
}

function connect() {
  const ws = new WebSocket(url);
  ws.onopen = () => { connected = true; };
  // 斷線時清除觸點：mtk-server 被強制結束或重新啟動時，最後的 ended 不會送達，不清除就會留下幽靈圓點
  ws.onclose = () => {
    connected = false;
    touches.clear();
    ripples.length = 0;
    setTimeout(connect, 2000);
  };
  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type === "hello") { devices = msg.devices; display = msg.display || null; }
    // 觸控螢幕晚於 mtk-server 接上、或顯示器重新排列時，對應的顯示器會改變
    if (msg.type === "display") display = msg.display || null;
    if (msg.type === "device") devices = devices.filter(d => d.id !== msg.device.id).concat(msg.event === "removed" ? [] : [msg.device]);
    if (msg.type !== "frame") return;
    frames++;
    for (const t of msg.touches) {
      if (t.phase === "ended" || t.phase === "cancelled") { touches.delete(t.id); continue; }
      touches.set(t.id, { x: t.x, y: t.y });
      if (t.phase === "began") { taps++; ripples.push({ x: t.x, y: t.y, start: performance.now(), id: t.id }); }
    }
    maxTouches = Math.max(maxTouches, touches.size);
  };
}
connect();

function hue(id) { return (id * 37) % 360; }

function drawCalibration(win, bounds) {
  ctx.strokeStyle = theme.grid;
  ctx.lineWidth = 1;
  for (const y of [0.1, 0.5, 0.9]) {
    for (const x of [0.1, 0.5, 0.9]) {
      const p = mapTouch({ x, y }, win, bounds);
      ctx.beginPath();
      ctx.moveTo(p.x - 20, p.y); ctx.lineTo(p.x + 20, p.y);
      ctx.moveTo(p.x, p.y - 20); ctx.lineTo(p.x, p.y + 20);
      ctx.stroke();
    }
  }
}

function draw(now) {
  syncCanvasSize();
  const win = windowGeometry();
  const bounds = display ? display.bounds : null;
  ctx.fillStyle = theme.canvas;
  ctx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);
  if (debug) drawCalibration(win, bounds);
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i], p = (now - r.start) / 350;
    if (p >= 1) { ripples.splice(i, 1); continue; }
    const at = mapTouch(r, win, bounds);
    ctx.strokeStyle = `hsla(${hue(r.id)}, 80%, 60%, ${1 - p})`;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(at.x, at.y, 40 + p * 80, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.font = "bold 18px ui-monospace, monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  let mode = "";
  for (const [id, t] of touches) {
    const at = mapTouch(t, win, bounds);
    mode = at.mode;
    ctx.fillStyle = `hsla(${hue(id)}, 70%, 55%, 0.85)`;
    ctx.beginPath();
    ctx.arc(at.x, at.y, 45, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.fillText(id, at.x, at.y);
  }
  const names = devices.map(d => `${d.product}（最多 ${d.maxContacts} 點）`).join("、") || "無";
  {
    let text = connected ? `已連線 ${url}` : `連線中斷，2 秒後重試（${url}）`;
    if (connected) text += `\n裝置：${names}\n觸點 ${touches.size}　最多 ${maxTouches}　按下 ${taps}`;
    const warning = geometryWarning(win, bounds, screen);
    if (warning) text += `\n⚠ ${warning}`;
    if (debug) {
      const v = viewportOnScreen(win);
      const calibrated = devices.some(d => d.calibrated);
      text += `\n— 診斷（D 關閉）—\n換算：${mode || mapTouch({ x: 0, y: 0 }, win, bounds).mode}　全螢幕：${win.fullscreen}`
        + `\n觸控校正：${calibrated ? "已套用" : "未校正（mtk-viewer --calibrate 可建立）"}`
        + `\n觸控螢幕 bounds：${bounds ? bounds.join(", ") : "無"}`
        + `\n視窗 screenX/Y：${win.screenX}, ${win.screenY}　outer：${win.outerWidth}x${win.outerHeight}　inner：${win.innerWidth}x${win.innerHeight}`
        + `\n內容區左上：${v.left}, ${v.top}　screen：${screen.width}x${screen.height}　devicePixelRatio：${devicePixelRatio}`;
      const first = touches.values().next().value;
      if (first) text += `\n第一個觸點：x=${first.x.toFixed(4)} y=${first.y.toFixed(4)}`;
    }
    // 內容改變時才更新 DOM（每幀重設 textContent 會造成不必要的版面重算）
    if (hud.textContent !== text) hud.textContent = text;
    const state = String(connected);
    if (panel.dataset.connected !== state) panel.dataset.connected = state;  // 狀態燈（CSS）
    const debugState = String(debug);
    if (panel.dataset.debug !== debugState) panel.dataset.debug = debugState;  // D 模式時移動面板（CSS）
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
